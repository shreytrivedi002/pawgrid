name: pawgrid
description: A peaceful offline garden logic puzzle.
publish_to: none
version: 0.6.1+10
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  puzzle_core:
    path: ../packages/puzzle_core
  flutter_riverpod: ^3.0.0
  drift: ^2.30.0
  drift_flutter: ^0.3.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.4.15
flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/audio/
    - assets/fonts/Lora-LICENSE.txt
    - assets/fonts/NunitoSans-LICENSE.txt
    - assets/fonts/SpaceGrotesk-LICENSE.txt
    - assets/fonts/DMSans-LICENSE.txt
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
